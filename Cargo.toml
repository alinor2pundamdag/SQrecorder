[workspace]
members = ["core/session-journal", "core/vault-core", "core/durable-store"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde_json = "1"
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"
zeroize = { version = "1", features = ["zeroize_derive"] }
