name: SQRecorder Android Vault contract validation

on:
  push:
    branches: [main, b4-hardening-approved-foundation]
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "shared/domain/**"
      - "shared/vault-keystore-android/**"
      - "core/native-abi/**"
      - "core/vault-crypto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/build-android-vault-native.sh"
      - ".github/workflows/android-vault-contract.yml"
  pull_request:
    paths:
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "shared/domain/**"
      - "shared/vault-keystore-android/**"
      - ".github/workflows/android-vault-contract.yml"

permissions:
  contents: read

concurrency:
  group: android-vault-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK 36
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platforms;android-36 build-tools;36.0.0 platform-tools ndk;28.2.13676358 system-images;android-36;google_apis;x86_64"
      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: "9.7.0"
          cache-provider: basic
          cache-read-only: false
      - name: Install pinned Rust toolchain and Android targets
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version
      - name: Build 16 KB-aligned Rust JNI libraries
        run: bash scripts/build-android-vault-native.sh
      - name: Compile Android Vault adapter and run host contract tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle :shared:vault-keystore-android:build --no-daemon --max-workers=2 2>&1 | tee "$RUNNER_TEMP/gradle-vault-build.log"; then
              break
            fi
            if ! grep -Eq "Could not find|Could not GET|HTTP (429|5[0-9][0-9])|status code (429|5[0-9][0-9])" "$RUNNER_TEMP/gradle-vault-build.log"; then
              exit 1
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Transient Maven/HTTP failure; retrying ($attempt/3) after 25s"
              sleep 25
            else
              exit 1
            fi
          done
          aar="$(find shared/vault-keystore-android/build/outputs/aar -type f -name '*.aar' | head -n 1)"
          test -n "$aar"
          unzip -l "$aar" | grep -q 'jni/arm64-v8a/libsqrec_native_abi.so'
          unzip -l "$aar" | grep -q 'jni/x86_64/libsqrec_native_abi.so'
          echo "Verified JNI libraries packaged in Android AAR."
      - name: Enable KVM for hardware-accelerated emulator
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "KVM available; emulator will use hardware acceleration."
            else
              echo "KVM exists but is not accessible; action will use documented TCG fallback."
            fi
          else
            echo "No /dev/kvm; emulator will use documented TCG fallback."
          fi
      - name: Run native Vault bridge on API 36 emulator
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: "-no-window -no-audio -no-boot-anim -camera-back none"
          script: gradle :shared:vault-keystore-android:connectedAndroidDeviceTest --no-daemon --max-workers=2
