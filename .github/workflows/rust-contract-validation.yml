name: SQRecorder Rust contract validation

on:
  push:
    branches:
      - batch-1-foundation
      - b4-hardening-approved-foundation
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - core/**
      - protocols/native-abi/**
      - tests/contract/**
      - shared/domain/**
      - shared/capability-system/**
      - .github/workflows/rust-contract-validation.yml
      - docs/architecture/**
      - docs/decisions/**
      - docs/security/**
      - docs/implementation/**
  pull_request:
    branches:
      - main
      - b4-hardening-approved-foundation
      - android-b5-capture
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - core/**
      - protocols/native-abi/**
      - tests/contract/**
      - .github/workflows/rust-contract-validation.yml
      - docs/architecture/**
      - docs/decisions/**
      - docs/security/**

permissions:
  contents: read

concurrency:
  group: rust-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: "1.100.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: Verify committed lockfile is current
        run: cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/cargo-metadata.json"
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
