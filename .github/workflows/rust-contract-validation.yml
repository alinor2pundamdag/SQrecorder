name: SQRecorder Rust contract validation

on:
  push:
    branches:
      - batch-1-foundation
      - b4-hardening-approved-foundation
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - core/**
      - .github/workflows/rust-contract-validation.yml
  pull_request:
    branches:
      - batch-1-foundation
      - b4-hardening-approved-foundation
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - core/**
      - .github/workflows/rust-contract-validation.yml

permissions:
  contents: read

jobs:
  rust-contracts:
    runs-on: ubuntu-latest
    env:
      RUST_TOOLCHAIN: "1.100.0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Clone exact pushed branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source
      - name: Install pinned Rust toolchain
        working-directory: source
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version
      - name: Resolve and generate workspace lock
        working-directory: source
        run: cargo generate-lockfile
      - name: Check Rust formatting
        working-directory: source
        run: cargo fmt --all -- --check
      - name: Workspace tests
        working-directory: source
        run: cargo test --workspace --locked
      - name: Clippy
        working-directory: source
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
