name: Rust B4 journal vault durability gate

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "core/**", ".github/workflows/rust-b4.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "core/**", ".github/workflows/rust-b4.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rust-b4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all
      - name: Emit formatter output for exact source repair
        run: cat core/vault-core/src/lib.rs core/durable-store/src/lib.rs
  tests:
    name: Workspace compile + journal, Vault, durability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo check --workspace
      - run: cargo test --workspace --all-targets
