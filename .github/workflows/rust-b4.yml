name: Rust B4 journal gate

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/session-journal/**"
      - ".github/workflows/rust-b4.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/session-journal/**"
      - ".github/workflows/rust-b4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-b4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journal:
    name: Session journal compile + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run journal unit tests
        run: cargo test --workspace
