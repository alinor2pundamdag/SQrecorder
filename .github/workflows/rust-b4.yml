name: Rust B4 journal gate

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/session-journal/**"
      - ".github/workflows/rust-b4.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "core/session-journal/**"
      - ".github/workflows/rust-b4.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-b4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust and rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check

  tests:
    name: Journal compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check workspace
        run: cargo check --workspace
      - name: Run journal tests
        run: cargo test --workspace --all-targets
