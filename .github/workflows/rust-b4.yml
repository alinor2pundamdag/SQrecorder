name: Rust B4 journal vault durability gate

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "core/**", ".github/workflows/rust-b4.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "core/**", ".github/workflows/rust-b4.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: rust-b4-${{ github.ref }}
  # Do not cancel verification of an earlier commit; each run records its own SHA.
  cancel-in-progress: false

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt && rustup default 1.85.1
      - run: cargo fmt --all -- --check
  tests:
    name: Workspace compile + journal, Vault, durability tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.85.1 --profile minimal && rustup default 1.85.1
      - name: Require committed lockfile
        run: git ls-files --error-unmatch Cargo.lock
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --all-targets --locked
      - name: Archive the committed Cargo.lock used by this CI run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b4-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 3
